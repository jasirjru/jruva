version: '3.8'

services:
  # 1. Primary Relational DB: PostgreSQL with pgvector extension
  db:
    image: pgvector/pgvector:pg16
    container_name: jru-postgres-vector
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-chatbot_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chatbot_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - jru-network

  # 2. High-Performance Decoupled Vector Database: Qdrant
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: jru-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jru-network

  # 3. High-Throughput FastAPI Asynchronous Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jru-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      - ENVIRONMENT=production
      - PORT=8000
      - WORKERS=2
      - QDRANT_URL=http://qdrant:6333
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@db:5432/${POSTGRES_DB:-chatbot_db}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - BENCHMARK_MODE=false
      - BENCHMARK_BYPASS_SECRET=${BENCHMARK_BYPASS_SECRET:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - jru-network

  # 4. Next.js 16 Standalone Production Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jru-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:8000
    networks:
      - jru-network

  # 5. Production Nginx Reverse Proxy with SSE Unbuffered Streaming
  proxy:
    image: nginx:alpine
    container_name: jru-proxy
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - jru-network

volumes:
  pgdata:
    driver: local
  qdrant_storage:
    driver: local

networks:
  jru-network:
    driver: bridge
